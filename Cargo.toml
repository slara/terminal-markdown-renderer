[package]
name = "tmdview"
version = "0.1.0"
edition = "2024"
description = "View a Markdown file rendered as HTML in a browser inside your terminal (via terminal-browser)"
authors = ["Sebastian Lara Menares"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/slara/terminal-markdown-renderer"
readme = "README.md"
keywords = ["markdown", "terminal", "viewer", "html", "cli"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json = "1.0.151"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
