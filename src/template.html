<!doctype html>
<html lang="en"{{theme_attr}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="{{base}}">
<title>{{title}}</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #1f2328;
  --muted: #59636e;
  --border: #d1d9e0;
  --subtle-bg: #f6f8fa;
  --link: #0969da;
  --mark: #fff8c5;
  --quote: #59636e;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #9198a1;
    --border: #3d444d;
    --subtle-bg: #151b23;
    --link: #4493f8;
    --mark: #bb800926;
    --quote: #9198a1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117;
  --fg: #e6edf3;
  --muted: #9198a1;
  --border: #3d444d;
  --subtle-bg: #151b23;
  --link: #4493f8;
  --mark: #bb800926;
  --quote: #9198a1;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
}
main { max-width: 860px; margin: 0 auto; padding: 32px clamp(16px, 6vw, 56px) 64px; overflow-wrap: break-word; }
main > :first-child { margin-top: 0; }

h1, h2, h3, h4, h5, h6 { margin: 1.5em 0 .6em; font-weight: 600; line-height: 1.25; }
h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
h3 { font-size: 1.25em; }
h4 { font-size: 1em; }
h5 { font-size: .875em; }
h6 { font-size: .85em; color: var(--muted); }
h1 > a.anchor, h2 > a.anchor, h3 > a.anchor { text-decoration: none; }

p, ul, ol, blockquote, pre, table, dl { margin: 0 0 1em; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; }
hr { height: 0; border: 0; border-top: 1px solid var(--border); margin: 1.5em 0; }
mark { background: var(--mark); color: inherit; }

ul, ol { padding-left: 2em; }
li + li { margin-top: .25em; }
li > input[type="checkbox"] { margin: 0 .4em 0 -1.3em; vertical-align: middle; }
ul:has(> li > input[type="checkbox"]) { list-style: none; }

blockquote { padding: 0 1em; color: var(--quote); border-left: .25em solid var(--border); }

code, pre, kbd {
  font-family: var(--mono);
  font-size: 85%;
}
:not(pre) > code { padding: .2em .4em; background: var(--subtle-bg); border-radius: 6px; }
pre {
  position: relative;
  padding: 16px;
  overflow: auto;
  line-height: 1.45;
  background: var(--subtle-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
}
pre > code { font-size: 100%; }
pre[data-lang]::before {
  content: attr(data-lang);
  position: absolute; top: 4px; right: 8px;
  font-size: 11px; color: var(--muted); text-transform: lowercase;
}

table { display: block; width: max-content; max-width: 100%; overflow: auto; border-collapse: collapse; }
th, td { padding: 6px 13px; border: 1px solid var(--border); }
td > .nowrap, th > .nowrap { white-space: nowrap; }
th { font-weight: 600; background: var(--subtle-bg); }
tr:nth-child(2n) td { background: var(--subtle-bg); }

.footnote-definition { font-size: .875em; color: var(--muted); display: flex; gap: .5em; }
.footnote-definition p { margin: 0; }
.math { font-family: "Latin Modern Math", "STIX Two Math", serif; }
.math-display { text-align: center; margin: 1em 0; overflow-x: auto; }

/* Code colors: syntect's, or the terminal theme's whole look. The pre keeps our own background/border. */
{{theme_css}}
pre.hl-code { background: var(--subtle-bg) !important; }

pre > .copy {
  position: absolute; top: 4px; right: 8px;
  font: 11px var(--mono); color: var(--muted);
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  height: 24px; padding: 0 6px; display: flex; align-items: center;
  cursor: pointer; opacity: 0;
}
pre:hover > .copy, pre > .copy:focus-visible { opacity: 1; }
pre[data-lang]:hover::before { visibility: hidden; }
</style>
</head>
<body>
<main>
{{body}}
</main>
<script>
// Plugins that draw after load pass their promise to `tmdview.ready`, since drawing changes the page height.
window.tmdview = { pending: [], ready(promise) { this.pending.push(promise); } };
</script>
{{plugins}}<script>
// A copy button on each code block. Plugin blocks are skipped: their plugin replaces them.
document.querySelectorAll("pre:not(.tmdview-plugin)").forEach(pre => {
  const btn = document.createElement("button");
  const icon = '<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>';
  btn.className = "copy";
  btn.ariaLabel = "Copy";
  btn.innerHTML = icon;
  btn.onclick = () => navigator.clipboard.writeText(pre.querySelector("code").innerText)
    .then(() => btn.textContent = "Copied", () => btn.textContent = "Failed")
    .then(() => setTimeout(() => btn.innerHTML = icon, 1500));
  pre.append(btn);
});
</script>
<script>
// Keep the scroll position when tmdview reloads the page after an edit.
(() => {
  const key = "tmdview-scroll:" + location.pathname;
  try {
    const y = sessionStorage.getItem(key);
    // Wait for images and for plugins, so the page is tall enough to scroll back to where it was.
    if (y !== null) addEventListener("load", () =>
      Promise.allSettled(tmdview.pending).then(() => window.scrollTo(0, +y)));
    addEventListener("beforeunload", () => sessionStorage.setItem(key, String(scrollY)));
  } catch (_) {}
})();
</script>
</body>
</html>
