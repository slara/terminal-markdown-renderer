<!doctype html>
<html lang="en"{{theme_attr}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="{{base}}">
<title>{{title}}</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #1f2328;
  --muted: #59636e;
  --border: #d1d9e0;
  --subtle-bg: #f6f8fa;
  --link: #0969da;
  --mark: #fff8c5;
  --quote: #59636e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #9198a1;
    --border: #3d444d;
    --subtle-bg: #151b23;
    --link: #4493f8;
    --mark: #bb800926;
    --quote: #9198a1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117;
  --fg: #e6edf3;
  --muted: #9198a1;
  --border: #3d444d;
  --subtle-bg: #151b23;
  --link: #4493f8;
  --mark: #bb800926;
  --quote: #9198a1;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
}
main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; overflow-wrap: break-word; }
main > :first-child { margin-top: 0; }

h1, h2, h3, h4, h5, h6 { margin: 1.5em 0 .6em; font-weight: 600; line-height: 1.25; }
h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
h3 { font-size: 1.25em; }
h4 { font-size: 1em; }
h5 { font-size: .875em; }
h6 { font-size: .85em; color: var(--muted); }
h1 > a.anchor, h2 > a.anchor, h3 > a.anchor { text-decoration: none; }

p, ul, ol, blockquote, pre, table, dl { margin: 0 0 1em; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; }
hr { height: 0; border: 0; border-top: 1px solid var(--border); margin: 1.5em 0; }
mark { background: var(--mark); color: inherit; }

ul, ol { padding-left: 2em; }
li + li { margin-top: .25em; }
li > input[type="checkbox"] { margin: 0 .4em 0 -1.3em; vertical-align: middle; }
ul:has(> li > input[type="checkbox"]) { list-style: none; }

blockquote { padding: 0 1em; color: var(--quote); border-left: .25em solid var(--border); }

code, pre, kbd {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 85%;
}
:not(pre) > code { padding: .2em .4em; background: var(--subtle-bg); border-radius: 6px; }
pre {
  position: relative;
  padding: 16px;
  overflow: auto;
  line-height: 1.45;
  background: var(--subtle-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
}
pre > code { font-size: 100%; }
pre[data-lang]::before {
  content: attr(data-lang);
  position: absolute; top: 4px; right: 8px;
  font-size: 11px; color: var(--muted); text-transform: lowercase;
}

table { display: block; width: max-content; max-width: 100%; overflow: auto; border-collapse: collapse; }
th, td { padding: 6px 13px; border: 1px solid var(--border); }
th { font-weight: 600; background: var(--subtle-bg); }
tr:nth-child(2n) td { background: var(--subtle-bg); }

.footnote-definition { font-size: .875em; color: var(--muted); display: flex; gap: .5em; }
.footnote-definition p { margin: 0; }
.math { font-family: "Latin Modern Math", "STIX Two Math", serif; }
.math-display { text-align: center; margin: 1em 0; overflow-x: auto; }

/* Syntax highlighting (syntect). The pre keeps our own background/border. */
{{highlight_css}}
pre.hl-code { background: var(--subtle-bg) !important; }
</style>
</head>
<body>
<main>
{{body}}
</main>
{{plugins}}<script>
// Keep the scroll position when tmdview reloads the page after an edit.
(() => {
  const key = "tmdview-scroll:" + location.pathname;
  try {
    const y = sessionStorage.getItem(key);
    // Wait for images so the page is tall enough to scroll back to where it was.
    // Plugins that draw after load (Mermaid) set `tmdviewReady`, since they change the height too.
    if (y !== null) addEventListener("load", () =>
      Promise.resolve(window.tmdviewReady).finally(() => window.scrollTo(0, +y)));
    addEventListener("beforeunload", () => sessionStorage.setItem(key, String(scrollY)));
  } catch (_) {}
})();
</script>
</body>
</html>
